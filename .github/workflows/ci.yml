name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.20.0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality

    env:
      DATABASE_URL: postgresql://task_app:task_app_ci_password@127.0.0.1:5432/task_management_test
      NODE_ENV: test
      AUTH_SECRET: ci-integration-auth-secret-2026-at-least-32-characters

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: task_app
          POSTGRES_PASSWORD: task_app_ci_password
          POSTGRES_DB: task_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_app -d task_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Check migration status
        run: pnpm db:status

      - name: Run integration tests
        run: pnpm exec vitest run --project integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality

    env:
      DATABASE_URL: postgresql://task_app:task_app_ci_password@127.0.0.1:5432/task_management_e2e
      NODE_ENV: test
      AUTH_SECRET: ci-e2e-auth-secret-2026-at-least-32-characters
      SEED_USER_EMAIL: e2e@example.com
      SEED_USER_PASSWORD: E2E-Test-Password-2026!
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3100
      CI: "true"

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: task_app
          POSTGRES_PASSWORD: task_app_ci_password
          POSTGRES_DB: task_management_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_app -d task_management_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Check migration status
        run: pnpm db:status

      - name: Seed E2E database
        run: pnpm db:seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://task_app:build_only_password@127.0.0.1:5432/task_management_build
      AUTH_SECRET: ci-build-auth-secret-2026-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build application
        run: pnpm build
